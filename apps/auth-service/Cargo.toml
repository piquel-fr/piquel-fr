[package]
name = "auth-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sourceorigin-common = { workspace = true, features = ["admin", "config", "email", "events", "similarity"] }
sourceorigin-crypto.workspace = true
sourceorigin-repository.workspace = true
sourceorigin-telemetry.workspace = true
sourceorigin-auth.workspace = true
sourceorigin-ui.workspace = true

axum.workspace = true
base64.workspace = true
chrono.workspace = true
ipnet.workspace = true
lettre.workspace = true
# Never named: webauthn-rs links OpenSSL, and this builds it vendored.
openssl.workspace = true
percent-encoding.workspace = true
clap.workspace = true
hyper.workspace = true
hyper-util.workspace = true
image.workspace = true
psl.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
topcoat = { workspace = true, features = ["router", "view", "tower", "multipart"] }
tower.workspace = true
tracing.workspace = true
url.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true

[dev-dependencies]
sourceorigin-auth = { workspace = true, features = ["axum"] }
rcgen.workspace = true
tokio-rustls.workspace = true
sourceorigin-repository = { workspace = true, features = ["test-util"] }
sourceorigin-telemetry = { workspace = true, features = ["test-util"] }
serde_urlencoded.workspace = true
insta.workspace = true
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[lints]
workspace = true

# `openssl` is listed only for its `vendored` feature, which webauthn-rs's copy
# then builds with.
[package.metadata.cargo-machete]
ignored = ["openssl"]
