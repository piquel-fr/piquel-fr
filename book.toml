# The documentation book. `just docs` builds and checks it, `just docs serve`
# previews it. See docs/dev/documentation.md.

[book]
title = "SourceOrigin"
description = "Origin Accounts: passkey-first accounts for SourceOrigin and the apps that sign in with them."
language = "en"
src = "docs"

[build]
build-dir = "target/book"
# A page listed in SUMMARY.md but missing fails the build.
create-missing = false

[output.html]
site-url = "/"
# Chapters are grouped into the user and contributor guides, not numbered.
no-section-label = true
git-repository-url = "https://github.com/sourceorigin-dev/sourceorigin"
edit-url-template = "https://github.com/sourceorigin-dev/sourceorigin/edit/main/{path}"
