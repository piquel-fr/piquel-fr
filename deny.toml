[advisories]
version = 2

[licenses]
version = 2
# Permissive dependencies and unchanged MPL library files may be distributed
# with SourceOrigin's code; retain their notices in source distributions.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]
exceptions = [
    # lettre's quoted-printable encoder. 0BSD is public-domain equivalent, even
    # more permissive than MIT, so it is allowed for this crate rather than everywhere.
    { crate = "quoted_printable", allow = ["0BSD"] },
    # SourceOrigin's own non-commercial crates. PolyForm is allowed for them by name,
    # never for third-party dependencies.
    { crate = "auth-service", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-crypto", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-web", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-repository", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-telemetry", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-ui", allow = ["PolyForm-Noncommercial-1.0.0"] },
]

[bans]
# A `*` requirement accepts any future release, breaking or malicious.
# Workspace crates name their version (Cargo.toml) so they don't count as one.
wildcards = "deny"
# Duplicates come from dependencies' own requirements, which this workspace
# can't change; warning about them would only bury real failures.
multiple-versions = "allow"

# Crates come from crates.io only: never another registry or a Git repository.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
