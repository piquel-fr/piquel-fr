[package]
name = "piquel-auth"
description = "Validate auth.piquel.fr tokens, declare typed scopes and sign users in"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Extractors, layers and login routes for axum.
axum = ["dep:axum", "dep:tower", "dep:tracing"]
# `axum::check_backend`, to test an application's session backend.
test-util = ["axum"]

[dependencies]
piquel-auth-protocol.workspace = true

axum = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
axum.workspace = true
trybuild.workspace = true

[[example]]
name = "notes"
required-features = ["axum"]

[lints]
workspace = true
