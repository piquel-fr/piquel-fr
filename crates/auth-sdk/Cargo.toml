[package]
name = "sourceorigin-auth"
description = "Validate auth.sourceorigin.dev tokens, declare typed scopes and sign users in"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
# Extractors, layers and login routes for axum.
axum = ["dep:axum", "dep:tower", "dep:tracing"]

[dependencies]
sourceorigin-common = { workspace = true, features = ["client-spans"] }
sourceorigin-crypto.workspace = true

axum = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
axum.workspace = true
# Paused time, so a test can wait out a deadline without waiting.
tokio = { workspace = true, features = ["test-util"] }
trybuild.workspace = true

[[example]]
name = "notes"
required-features = ["axum"]

[lints]
workspace = true
