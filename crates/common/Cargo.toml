[package]
name = "piquel-common"
description = "Identifiers, vocabularies and auth protocol wire types shared across Piquel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The views of administration, for auth and its dashboard.
admin = ["dep:serde_json"]
# Environment variables, validated origins and secret references, for servers.
config = []
# Email address normalization, for servers that store or compare addresses.
email = ["dep:unicode-normalization"]
# Domain events recorded by auth.
events = ["dep:serde_json", "email"]
# SQLx decoding for identifiers and `str_enum!` vocabularies; only `crates/database` enables it.
sqlx = ["dep:sqlx"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
unicode-normalization = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# The vector generator signs with auth's own signer. A dev-dependency cycle is
# allowed, and integration tests link the same build of this crate as the signer.
piquel-crypto.workspace = true
base64.workspace = true
openssl.workspace = true
serde_json.workspace = true

[lints]
workspace = true
