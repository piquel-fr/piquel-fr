[package]
name = "sourceorigin-common"
description = "Identifiers, vocabularies and auth protocol wire types shared across SourceOrigin"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
# The views of administration, for auth and its dashboard.
admin = ["dep:serde_json"]
# `SendTraced`: client spans around `reqwest` requests, for auth and the SDK.
client-spans = ["dep:reqwest", "dep:tracing"]
# Environment variables, validated origins and secret references, for servers.
config = []
# Email address normalization, for servers that store or compare addresses.
email = ["dep:unicode-normalization"]
# Domain events recorded by auth. Audit chain verifications are recorded as the
# admin view `AuditVerification`.
events = ["dep:serde_json", "admin", "email"]
# The RS256 verifier and compact JWS splitting, for auth and the SDKs.
jws = ["dep:aws-lc-rs", "dep:base64"]
# Look-alike detection for handles, client names and the names reserved from them.
similarity = ["dep:unicode-security"]
# SQLx decoding for identifiers and `str_enum!` vocabularies; only `crates/database` enables it.
sqlx = ["dep:sqlx"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
unicode-security = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# The vector generator signs with auth's own signer. A dev-dependency cycle is
# allowed, and integration tests link the same build of this crate as the signer.
sourceorigin-crypto.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
serde_json.workspace = true
# The protocol types derive `TS` under `cfg(test)` only, so no build depends on it.
ts-rs.workspace = true

[lints]
workspace = true
