[package]
name = "piquel-auth-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# SQLx decoding for identifiers and vocabularies; only `crates/database` enables it.
sqlx = ["dep:sqlx", "piquel-common/sqlx"]

[dependencies]
piquel-common.workspace = true
chrono.workspace = true
serde.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# The vector generator signs with auth's own signer. A dev-dependency cycle is
# allowed, and integration tests link the same build of this crate as the signer.
piquel-crypto.workspace = true
base64.workspace = true
openssl.workspace = true
serde_json.workspace = true

[lints]
workspace = true
