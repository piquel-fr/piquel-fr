[workspace]
resolver = "3"
members = [
    "apps/auth-service",
    "crates/auth-protocol",
    "crates/configuration",
    "crates/database",
    "crates/telemetry",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/piquel-fr/piquel-fr"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code          = "forbid"
missing_docs         = "warn"

[workspace.lints.clippy]
pedantic   = "warn"
unwrap_used = "warn"

[workspace.dependencies]
# Local crates
piquel-configuration = { path = "crates/configuration" }
piquel-repository    = { path = "crates/database" }
piquel-telemetry     = { path = "crates/telemetry" }
piquel-auth-protocol = { path = "crates/auth-protocol" }

# External crates
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
http = "1.3"
ipnet = "2.12"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
unicode-normalization = "0.1"
uuid = { version = "1.19", features = ["v7", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui", "workaround-google-passkey-specific-issues"] }

jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webauthn-rs-proto = "0.5.5"

# Line tables keep file and line numbers in backtraces but drop the variable
# and type info that makes up most of a debug build's output. Also applies to
# tests, which inherit this profile.
[profile.dev]
debug = "line-tables-only"
