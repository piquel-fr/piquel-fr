[workspace]
resolver = "3"
members = []

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/piquel-fr/piquel-fr"
rust-version = "1.97.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code          = "forbid"
missing_docs         = "warn"

[workspace.lints.clippy]
pedantic   = "warn"
unwrap_used = "warn"
