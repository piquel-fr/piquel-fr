[workspace]
resolver = "3"
members = [
    "apps/admin-web",
    "apps/auth-service",
    "crates/admin-api",
    "crates/auth-sdk",
    "crates/common",
    "crates/crypto",
    "crates/database",
    "crates/telemetry",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/piquel-fr/piquel-fr"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
unwrap_used = "warn"

[workspace.dependencies]
# Local crates
piquel-common        = { path = "crates/common" }
piquel-crypto        = { path = "crates/crypto" }
piquel-repository    = { path = "crates/database" }
piquel-telemetry     = { path = "crates/telemetry" }
piquel-auth          = { path = "crates/auth-sdk" }
piquel-admin-api     = { path = "crates/admin-api" }

# External crates
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
http = "1.3"
ipnet = "2.12"
openssl = { version = "0.10", features = ["vendored"] }
# OTLP/HTTP with protobuf, sent through the workspace's reqwest: no gRPC stack.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-appender-tracing = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "ipnet", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
unicode-normalization = "0.1"
uuid = { version = "1.19", features = ["v7", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui", "workaround-google-passkey-specific-issues"] }

# Transactional email: SMTP over implicit TLS or required STARTTLS, with rustls
# (ring, as reqwest uses) and webpki roots, never native-tls/OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# Decodes the SMTP user in AUTH_SMTP_URL; already in the tree through url and lettre.
percent-encoding = "2.3"
# Email bodies, from templates checked at compile time.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }

# JWS signature checks only; the SDK validates claims itself. aws-lc-rs is
# constant-time and avoids the RustCrypto `rsa` crate's RUSTSEC-2023-0071.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
secrecy = "0.10"
trybuild = "1.0"
# Test-only: a self-signed certificate and TLS listener so tests reach auth over HTTPS.
rcgen = "0.14"
tokio-rustls = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webauthn-rs-proto = "0.5.5"

# Line tables keep file and line numbers in backtraces but drop the variable
# and type info that makes up most of a debug build's output. Also applies to
# tests, which inherit this profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
