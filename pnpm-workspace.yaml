# The root package holds the repository's web tooling; packages/ holds the
# TypeScript SDK, and the SvelteKit recipe its README type-checks.
packages:
  - packages/*
  - packages/auth/examples/sveltekit
auditConfig:
  ignoreGhsas:
    # minimatch DoS, fixed only in minimatch 11, while eslint and
    # typescript-eslint, its only dependents, require ^10. They are dev
    # tools matching globs we write. Remove once they accept minimatch 11.
    - GHSA-g3hv-75wg-m249
# Peers are not installed for packages that do not list them: the recipe needs
# SvelteKit's types only, not vite and svelte, its build toolchain.
autoInstallPeers: false
# workerd's install script only fetches its binary when the platform package is
# missing, which pnpm installs anyway.
allowBuilds:
  workerd: false
