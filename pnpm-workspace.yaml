packages:
  - apps/*
  - packages/*

catalog:
  '@sveltejs/adapter-node': 5.5.7
  '@sveltejs/adapter-static': 3.0.10
  '@sveltejs/kit': 2.70.3
  '@sveltejs/vite-plugin-svelte': 7.3.0
  svelte: 5.57.0
  svelte-check: 4.7.6
  typescript: 6.0.3
  vite: 8.3.4

onlyBuiltDependencies:
  - esbuild

# SvelteKit's cookie API is compatible with the security-patched 0.7 series.
overrides:
  cookie@<0.7.0: 0.7.2

# Both are fixed only in SvelteKit 3, and neither applies: no app uses
# `use:enhance` (GHSA-pfhg-q3qv-9q6r, an open redirect from enhanced forms) or
# `setHeaders` (GHSA-27mw-82g8-phjj, an XSS through a prerendered page's
# cache-control). Remove both with SvelteKit, which auth's own pages replace.
auditConfig:
  ignoreGhsas:
    - GHSA-pfhg-q3qv-9q6r
    - GHSA-27mw-82g8-phjj
