api_version = "piqueld.dev/v1alpha1"
kind = "Application"

[metadata]
name = "piquel-fr"

[spec.manifest]
path = "infra/prod.toml"

[spec.manifest.repository]
url = "https://github.com/piquel-fr/piquel-fr.git"
branch = "main"

[[spec.routes]]
hostname = "auth.piquel.fr"
service = "auth"
port = 8080

[[spec.routes]]
hostname = "piquel.fr"
service = "web"
port = 8080

[[spec.services]]
name = "auth"
replicas = 1

[spec.services.source]
type = "git"
[spec.services.source.repository]
url = "https://github.com/piquel-fr/piquel-fr.git"
branch = "main"
[spec.services.source.build]
type = "docker"
dockerfile = "infra/auth.Dockerfile"
context = "."

[spec.services.environment]
AUTH_DATABASE_URL = "postgres://piquel@localhost/piquel?host=/run/postgresql&sslmode=disable"
AUTH_DATABASE_PASSWORD = "file:///run/secrets/database-password"
AUTH_KEY_PROVIDER = "file:///run/secrets/signing-key"
AUTH_PUBLIC_LISTENER = "0.0.0.0:8080"
AUTH_PUBLIC_BASE_URL = "https://auth.piquel.fr"
AUTH_SETTINGS_URL = "https://piquel.fr/settings"

[[spec.services.secrets]]
name = "database-password"
target = "/run/secrets/database-password"

[[spec.services.secrets]]
name = "signing-key"
target = "/run/secrets/signing-key"

[[spec.services.mounts]]
volume = "postgres-socket"
target = "/run/postgresql"
read_only = true

[spec.services.healthcheck]
type = "http"
port = 8080
path = "/health/ready"

[[spec.services]]
name = "web"
replicas = 1

[spec.services.source]
type = "git"
[spec.services.source.repository]
url = "https://github.com/piquel-fr/piquel-fr.git"
branch = "main"
[spec.services.source.build]
type = "docker"
dockerfile = "infra/web.Dockerfile"
context = "."

[spec.services.healthcheck]
type = "http"
port = 8080
path = "/"

[[spec.services]]
name = "postgres"
replicas = 1
# Connections stay on the shared Unix socket; PostgreSQL has no TCP listener.
arguments = ["postgres", "-c", "listen_addresses="]

[spec.services.source]
type = "image"
image = "postgres:18-bookworm"

[spec.services.environment]
POSTGRES_USER = "piquel"
POSTGRES_DB = "piquel"
POSTGRES_PASSWORD_FILE = "/run/secrets/database-password"
POSTGRES_INITDB_ARGS = "--auth-local=scram-sha-256"

[[spec.services.secrets]]
name = "database-password"
target = "/run/secrets/database-password"

[[spec.services.mounts]]
volume = "postgres-data"
target = "/var/lib/postgresql"

[[spec.services.mounts]]
volume = "postgres-socket"
target = "/var/run/postgresql"

[spec.services.healthcheck]
type = "command"
command = ["pg_isready", "-h", "/var/run/postgresql", "-U", "piquel", "-d", "piquel"]

[[spec.volumes]]
name = "postgres-data"

[[spec.volumes]]
name = "postgres-socket"
