# Tempo 3.1, monolithic: receives traces from the collector over OTLP/gRPC and
# keeps them for 14 days.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 336h

usage_report:
  reporting_enabled: false
