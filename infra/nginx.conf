worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Sets $auth_origin; web-entrypoint.sh writes it from AUTH_ORIGIN.
        include /tmp/auth-origin.conf;

        # The page's own CSP allows any HTTPS origin for connect-src, since the
        # image serves every environment. Browsers enforce both policies.
        add_header Content-Security-Policy "connect-src 'self' $auth_origin" always;

        location = /config.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"auth_origin":"$auth_origin"}';
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
