#:schema https://raw.githubusercontent.com/piquel-fr/piqueld/main/docs/application-manifest.schema.json
# piquel.fr on piqueld. The environments below are the application's only ones:
# staging builds `main` on every push, production only receives releases
# promoted from staging, and previews deploy branches or local worktrees. See
# infra/README.md.
api_version = "piqueld.dev/v1alpha1"
kind = "Application"

[metadata]
name = "piquel-fr"

[spec.manifest]
path = "infra/piqueld.toml"
sync = { mode = "webhook" }

[spec.manifest.repository]
url = "https://github.com/piquel-fr/piquel-fr.git"
branch = "main"

# Hostnames have no default: an environment without its own fails to deploy
# instead of competing for another one's. Neither do `smtp_secret`, the stored
# Resend key an environment sends with, and `email_from`: production sends as
# piquel.fr with its own key, staging and previews as dev.piquel.fr with
# another, so their mail never spends production's reputation. See "Email" in
# infra/README.md.
[spec.variables]
invite_required = "true"
# Previews sign audit checkpoints with a generated key. Staging and production
# use stored keys whose verifier keys are committed in docs/security/audit-key.pub.
audit_key = "audit-key"
# See "Running several replicas" in infra/README.md before raising it.
auth_replicas = 1
# Where auth, with the admin dashboard it serves, sends telemetry: the
# `telemetry` application's collector, imported below. Empty sends none.
otlp_endpoint = "http://collector.telemetry:4318"

[spec.environments.production]
promote_from = "staging"

[spec.environments.production.variables]
web_host = "piquel.fr"
auth_host = "auth.piquel.fr"
www_host = "www.piquel.fr"
admin_host = "admin.piquel.fr"
smtp_secret = "resend-production"
email_from = "Piquel <security@piquel.fr>"
audit_key = "audit-key-production"

[spec.environments.staging]
sync = true
visibility = "private"

[spec.environments.staging.variables]
web_host = "staging.piquel.fr"
auth_host = "auth.staging.piquel.fr"
www_host = "www.staging.piquel.fr"
admin_host = "admin.staging.piquel.fr"
smtp_secret = "resend-dev"
email_from = "Piquel <security@dev.piquel.fr>"
audit_key = "audit-key-staging"

# Flat hostnames, so the `*.dev.piquel.fr` certificate covers every preview.
# Preview databases start empty, so anyone on the tailnet may register.
[spec.previews]
visibility = "private"

[spec.previews.variables]
web_host = "${{ env.slug }}.dev.piquel.fr"
auth_host = "auth-${{ env.slug }}.dev.piquel.fr"
www_host = "www-${{ env.slug }}.dev.piquel.fr"
admin_host = "admin-${{ env.slug }}.dev.piquel.fr"
smtp_secret = "resend-dev"
email_from = "Piquel <security@dev.piquel.fr>"
invite_required = "false"
# Previews keep their telemetry on stderr: the collector does not export to them.
otlp_endpoint = ""

# piquel.fr serves nothing of its own yet: the gateway sends every path, with its
# query, to the same one on auth, which serves the account settings. Temporary
# (307), so browsers cache nothing once piquel.fr serves pages again. See "Web"
# in infra/README.md.
[[spec.routes]]
name = "web"
hostname = "${{ vars.web_host }}"
redirect = { to = "https://${{ vars.auth_host }}", status = 307, preserve_path = true }
visibility = "public"

[[spec.routes]]
name = "auth"
hostname = "${{ vars.auth_host }}"
service = "auth"
port = 8080
visibility = "public"

# The admin dashboard, which auth serves on its admin listener, is reachable only
# from the tailnet, in every environment.
[[spec.routes]]
name = "admin"
hostname = "${{ vars.admin_host }}"
service = "auth"
port = 8081
visibility = "private"

# Routes cannot be limited to one environment, so staging and previews redirect
# their own `www` name too. The gateway answers; path and query are kept.
[[spec.routes]]
name = "www"
hostname = "${{ vars.www_host }}"
redirect = { to = "https://${{ vars.web_host }}", status = 308, preserve_path = true }
visibility = "public"

# The collector of the `telemetry` application (infra/telemetry.toml), as
# `collector.telemetry`. It has only a production environment, which staging
# and production share; `deployment.environment.name` tells them apart.
[[spec.imports]]
application = "telemetry"
service = "collector"
environment = "production"

# The PostgreSQL superuser's password, which only the database and the `migrate`
# job get.
[[spec.secrets]]
name = "database-password"
generate = { type = "random", bytes = 32, encoding = "hex" }

# The password of `piquel_auth`, the restricted role auth connects as. `migrate`
# sets it on every deploy.
[[spec.secrets]]
name = "database-runtime-password"
generate = { type = "random", bytes = 32, encoding = "hex" }

# Seals the signing keys auth stores in its database (AUTH_KEY_ENCRYPTION_KEY).
[[spec.secrets]]
name = "key-encryption-key"
generate = { type = "random", bytes = 32, encoding = "base64url" }

# Will digest refresh tokens, codes and pending logins. Accepted for now, so the
# release that makes it current can roll back (see infra/README.md).
[[spec.secrets]]
name = "token-digest-key"
generate = { type = "random", bytes = 32, encoding = "base64url" }

# The signing key before keys moved to the database. The `signing-key-import`
# job imports it, and it stays the token digest key until the migration in
# infra/README.md moves digests to `token-digest-key`.
[[spec.secrets]]
name = "signing-key"
generate = { type = "rsa", bits = 3072 }

# The Ed25519 seed that signs a preview's audit checkpoints, apart from the OIDC
# signing key so the two rotate independently. Staging and production mount
# stored seeds instead. See docs/security/audit-history.md.
[[spec.secrets]]
name = "audit-key"
generate = { type = "random", bytes = 32, encoding = "hex" }

# Applies migrations as the superuser, then creates or resets `piquel_auth`.
[[spec.jobs]]
name = "migrate"
service = "auth"
command = ["auth-service", "migrate"]
run = "before-rollout"

[spec.jobs.environment]
AUTH_DATABASE_OWNER_URL = "postgres://piquel@postgres:5432/piquel?sslmode=disable"
AUTH_DATABASE_OWNER_PASSWORD = "file:///run/secrets/database-password"

[[spec.jobs.secrets]]
name = "database-password"
target = "/run/secrets/database-password"

# Imports the PEM signing key as the active key before the first release that
# reads keys from the database serves, so no token it signed breaks. It imports
# only into an empty key set, so later deploys change nothing.
[[spec.jobs]]
name = "signing-key-import"
service = "auth"
command = ["auth-service", "keys", "import", "file:///run/secrets/signing-key"]
run = "before-rollout"

[[spec.services]]
name = "auth"
depends_on = ["postgres"]
replicas = "${{ vars.auth_replicas }}"

[spec.services.source]
type = "git"
repository = "self"

[spec.services.source.build]
type = "docker"
dockerfile = "infra/auth.Dockerfile"

[spec.services.environment]
# Plaintext stays on the application's private network, which ingress cannot reach.
AUTH_DATABASE_URL = "postgres://piquel_auth@postgres:5432/piquel?sslmode=disable"
AUTH_DATABASE_PASSWORD = "file:///run/secrets/database-runtime-password"
AUTH_KEY_ENCRYPTION_KEY = "file:///run/secrets/key-encryption-key"
AUTH_TOKEN_DIGEST_KEY = "file:///run/secrets/signing-key"
AUTH_TOKEN_DIGEST_KEY_ACCEPTED = "file:///run/secrets/token-digest-key"
AUTH_AUDIT_KEY_PROVIDER = "file:///run/secrets/audit-key"
AUTH_PUBLIC_LISTENER = "0.0.0.0:8080"
# The admin dashboard, which only the private `admin` route reaches, for its own
# origin.
AUTH_ADMIN_LISTENER = "0.0.0.0:8081"
AUTH_ADMIN_ORIGIN = "https://${{ vars.admin_host }}"
AUTH_PUBLIC_BASE_URL = "https://${{ vars.auth_host }}"
AUTH_INVITE_REQUIRED = "${{ vars.invite_required }}"
AUTH_SMTP_URL = "smtps://resend@smtp.resend.com:465"
AUTH_SMTP_PASSWORD = "file:///run/secrets/smtp-password"
AUTH_EMAIL_FROM = "${{ vars.email_from }}"
OTEL_EXPORTER_OTLP_ENDPOINT = "${{ vars.otlp_endpoint }}"
OTEL_RESOURCE_ATTRIBUTES = "deployment.environment.name=${{ env.name }}"

[[spec.services.secrets]]
name = "database-runtime-password"
target = "/run/secrets/database-runtime-password"

[[spec.services.secrets]]
name = "key-encryption-key"
target = "/run/secrets/key-encryption-key"

[[spec.services.secrets]]
name = "token-digest-key"
target = "/run/secrets/token-digest-key"

[[spec.services.secrets]]
name = "signing-key"
target = "/run/secrets/signing-key"

[[spec.services.secrets]]
name = "${{ vars.audit_key }}"
target = "/run/secrets/audit-key"

# Set by hand with `piquelctl app secret`, not generated: see "Email" in
# infra/README.md.
[[spec.services.secrets]]
name = "${{ vars.smtp_secret }}"
target = "/run/secrets/smtp-password"

[spec.services.healthcheck]
type = "http"
port = 8080
path = "/health/ready"

[[spec.services]]
name = "postgres"

[spec.services.source]
type = "image"
image = "postgres:18-bookworm"

[spec.services.environment]
POSTGRES_USER = "piquel"
POSTGRES_DB = "piquel"
POSTGRES_PASSWORD_FILE = "/run/secrets/database-password"

[[spec.services.secrets]]
name = "database-password"
target = "/run/secrets/database-password"

[[spec.services.mounts]]
volume = "postgres-data"
target = "/var/lib/postgresql"

# Over TCP: the server initializing a new volume listens only on its socket, so
# the migration job waits for the real one.
[spec.services.healthcheck]
type = "command"
command = ["pg_isready", "-h", "127.0.0.1", "-U", "piquel", "-d", "piquel"]

[[spec.volumes]]
name = "postgres-data"
